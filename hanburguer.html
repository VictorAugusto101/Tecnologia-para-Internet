<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hambúrgueria Cardapio</title>
    <style>
        .cardapio {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #f0f0f0;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>    
</head>
<body>
    <div class="cardapio">
        <h1>Cardápio de Hambúrgueres</h1>
        <ul>
            <li>Hambúrguer Clássico - R$ 15,00</li>
            <li>Hambúrguer com Queijo - R$ 18,00</li>
            <li>Hambúrguer Bacon - R$ 20,00</li>
            <li>Hambúrguer Vegano - R$ 22,00</li>
        </ul>
    </div>
</body>
</html>
