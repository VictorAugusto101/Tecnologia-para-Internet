<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hambúrgueria Cardapio</title>
    <style>
       body{
            background-color: #eb9829;
       }

       button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #000000c9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #000000c9;
       }

        .cardapio {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-family: impact, sans-serif;
            font-size: 4rem;
            text-shadow: 2px 2px 4px #00000063;
            text-align: center;
            color: #fcdaa8;
            border-top: 2px solid #00000063;
            border-color: white;
            padding-top: 20px;

        }
        h3 {
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #000000c9;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #f0f0f0;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>    
</head>
<body>
    <div class="cardapio">
        <h1>Cardápio</h1>
        <h3>Hambúrgueres</h3>
        <ul >
            <li>Hambúrguer Clássico - R$ 15,00</li>
            <li>Hambúrguer com Queijo - R$ 18,00</li>
            <li>Hambúrguer Bacon - R$ 20,00</li>
            <li>Hambúrguer Vegano - R$ 22,00</li>
        </ul>
    </div>
    <button onclick="window.location.href='principal.html'">Página Principal</button>
</body>
</html>
