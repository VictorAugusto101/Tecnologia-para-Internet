<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hambúrgueria Cardapio</title>
    <link rel="stylesheet" href="header.css">
    <style>
       body{
            background-color: #eb9829;
       }

    .logo-hamburguer {
        font-size: 4vh;
        text-decoration: none;
        list-style: none;
        color: rgb(105, 1, 1);
        font-family: 'Prata', serif;
    }

       .botao-principal {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #000000c9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .botao-principal:hover {
            background-color: #222;
        }

        .cardapio {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-family: impact, sans-serif;
            font-size: 4rem;
            text-shadow: 2px 2px 4px #00000063;
            text-align: center;
            color: #fcdaa8;
            border-top: 2px solid #00000063;
            border-color: white;
            padding-top: 20px;

        }
        h3 {
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #000000c9;
        }
       .grid-lanches {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .cartao-lanche {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
        }

        .cartao-lanche img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            object-position: center;
            border-radius: 8px;
            background-color: white;
        }

        .preco {
            font-weight: bold;
            color: green;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .grid-lanches {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .grid-lanches {
                grid-template-columns: 1fr;
            }
        }
    </style>    
</head>
<body>
    <header>
        <a href="principal.html" class="logo-hamburguer">Hambúrgueria</a>
        <button class="menu-toggle" aria-label="Toggle menu">☰</button>
        <nav>
            <a href="principal.html">Home</a>
            <a href="hanburguer.html">Cardápio</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <div class="cardapio">
        <h1>Cardápio</h1>
        <h3>Hambúrgueres</h3> 
    </div>

    <div id="lista-lanches" class="grid-lanches">

    </div>

    <button class="botao-principal" onclick="window.location.href='principal.html'">Página Principal</button>
    <script src="hanburguer.js" defer></script>
    <script src="header.js" defer></script>
</body>
</html>
