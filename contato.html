<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Contato Hamburgueres</title>
    <link rel="stylesheet" href="header.css">
    <style>
    
    .logo-hamburguer {
        font-size: 4vh;
        text-decoration: none;
    }
    
    section {
        margin: 20px;
        position: relative;
        top: 100%;
        right: 0;
        color: black;
        padding-block: 100px;
        height: 50vh;
        border: none;
        border-radius: 5px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    section h2 {
        align-items: center;
        font-size: 2em;
        margin-bottom: 10px;
    }
    section table {
        font-size: 1.2em;
        border-collapse: collapse;
        width: 100%;
        border-radius: 5px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    section table td {
        padding: 15px 20px;
        border: none;
        border-radius: 0.5dvh;
        background-color: #f5f5f5;
    }
    
    section table td a {
        color: #f80000c9;
        text-decoration: none;
    }

    </style>
</head>

    <header>
        <a href="principal.html" class="logo-hamburguer">🍔</a>

        <button class="menu-toggle" id="menu-btn">☰</button>

    </header>
    <section>
        <div>
            <h2>Contato</h2>
            <table>
                <tr>
                    <td>Telefone:</td>
                    <td><a href="tel:+553412345678">(34) 1234-5678</a></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><a href="mailto:contato@hamburgueria.com">contato@hamburgueria.com</a></td>
                </tr>
